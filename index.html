<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simulasi interaktif step-by-step algoritma Line DDA, Bresenham, Midpoint Circle & Ellipse, serta drawing bangun datar.">
  <title>Line Algorithm Simulator — DDA, Bresenham, Midpoint | Shapes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- ===== HEADER ===== -->
    <header class="header">
      <div class="header-title">
        <h1>🔬 Line Algorithm Simulator</h1>
        <span class="badge">Phase 3</span>
      </div>

      <!-- Tab Bar -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="line">📐 Line Algorithm</button>
        <button class="tab-btn" data-tab="shapes">🔷 Shapes</button>
        <button class="tab-btn" data-tab="curves">⭕ Curves</button>
      </div>

      <!-- Line Algorithm Controls -->
      <div id="line-controls" class="tab-content">
        <div class="header-controls">
          <!-- Algorithm Selection -->
          <div class="control-group">
            <label for="algo-select">Algoritma:</label>
            <select id="algo-select">
              <option value="dda">Line DDA</option>
              <option value="bresenham">Bresenham</option>
            </select>
          </div>

          <div class="control-separator"></div>

          <!-- Coordinate Inputs -->
          <div class="control-group">
            <label>P1:</label>
            <input type="number" id="input-x1" class="coord-input" value="0" title="x1">
            <input type="number" id="input-y1" class="coord-input" value="0" title="y1">
          </div>
          <div class="control-group">
            <label>P2:</label>
            <input type="number" id="input-x2" class="coord-input" value="20" title="x2">
            <input type="number" id="input-y2" class="coord-input" value="8" title="y2">
          </div>

          <div class="control-separator"></div>

          <!-- Presets -->
          <div class="control-group" id="preset-container">
            <label>Preset:</label>
          </div>
        </div>
      </div>

      <!-- Shapes Controls -->
      <div id="shapes-controls" class="tab-content hidden">
        <div class="header-controls">
          <div class="control-group">
            <label for="shape-algo-select">DrawLine via:</label>
            <select id="shape-algo-select">
              <option value="dda">DDA</option>
              <option value="bresenham">Bresenham</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Curves Controls -->
      <div id="curves-controls" class="tab-content hidden">
        <div class="header-controls">
          <div class="control-group">
            <label>📐 Midpoint Curve Algorithm</label>
            <span style="font-size: 11px; color: var(--text-secondary);">
              Circle: Fokus Oktan 1 (0°–45°) &rarr; Replikasi 8 Oktan (CCW) | Ellipse: 4 Kuadran (Region 1 & 2)
            </span>
          </div>
          <div id="symmetry-legend-container" class="symmetry-legend"></div>
        </div>
      </div>

      <!-- Playback Row (shared) -->
      <div class="header-playback">
        <button id="btn-play" class="play-btn primary">▶ Play</button>
        <button id="btn-step" class="play-btn secondary">⏭ Step</button>
        <button id="btn-reset" class="play-btn secondary">↺ Reset</button>

        <div class="control-separator"></div>

        <div class="control-group">
          <label>Speed:</label>
          <input type="range" id="speed-slider" min="1" max="100" value="40">
          <span class="speed-label" id="speed-label">600ms</span>
        </div>

        <div class="control-separator"></div>

        <!-- Grid Size (shared between tabs) -->
        <div class="control-group">
          <label for="grid-size-select">Grid:</label>
          <select id="grid-size-select">
            <option value="8">±8</option>
            <option value="16">±16</option>
            <option value="32" selected>±32</option>
            <option value="64">±64</option>
          </select>
        </div>

        <span class="step-counter" id="step-counter">Step: 0</span>
      </div>

      <!-- Info Bar -->
      <div class="header-info" id="info-bar">
        <span class="info-hint">Masukkan koordinat lalu tekan Play/Step atau pilih preset.</span>
      </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main">

      <!-- Column 1: Grid Canvas -->
      <div class="grid-panel">
        <canvas id="grid-canvas"></canvas>
        <div class="hover-coord" id="hover-coord">—</div>
      </div>

      <!-- Column 2: Code View & Step Info -->
      <div class="code-panel">
        <div class="panel-header">
          <span class="icon">📝</span> <span id="code-panel-title">Algorithm Code (C#)</span>
        </div>
        <!-- Extra Parameters (shapes / curves mode) -->
        <div id="shape-params-bar" class="shape-params-bar hidden"></div>
        <div id="curve-params-bar" class="curve-params-bar hidden"></div>
        <div class="code-container" id="code-container">
          <!-- Populated by codeview.js -->
        </div>
        <div class="step-description" id="step-description">
          Tekan "Step" atau "Play" untuk mulai simulasi.
        </div>
      </div>

      <!-- Column 3: Tracing Table & Shape Selector -->
      <div class="trace-panel">
        <div class="panel-header">
          <span class="icon">📊</span> <span id="trace-panel-title">Tracing Table</span>
        </div>
        <!-- Selector Bar (shapes / curves mode) -->
        <div id="shape-selector-bar" class="shape-selector-bar hidden"></div>
        <div id="curve-selector-bar" class="curve-selector-bar hidden"></div>
        <div class="trace-scroll" id="trace-scroll">
          <table>
            <thead id="trace-head"></thead>
            <tbody id="trace-body"></tbody>
          </table>
        </div>
      </div>

    </main>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
